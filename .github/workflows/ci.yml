name: ci

# PR gate. wheels.yml (v* tags) still owns publishing.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto:
    name: buf lint + wire-compat
    runs-on: ubuntu-latest
    # A hang here used to cost GitHub's 360-minute default, and a wedged job
    # is indistinguishable from a slow one the whole time. These finish in
    # about three minutes; ten is generous and can only fire on a hang.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # foxglove-sdk supplies the second buf module
          fetch-depth: 0          # `make breaking` needs history for the merge-base

      - uses: bufbuild/buf-setup-action@v1

      - run: make lint

      # BREAKING_STRICT: a missing baseline ref must fail the gate, not skip it.
      - name: make breaking
        run: make breaking BREAKING_REF=origin/${{ github.base_ref || 'main' }} BREAKING_STRICT=1

  tests:
    # Two legs over the install surface: "" is the lean codec-only install that a
    # wire-contract consumer gets; "[display]" adds the viewer/`--serve` extra. Only
    # the `pip install` line differs — the pytest command is identical, and the
    # `tests/display/` suite runs iff its deps are present (importorskip skips it on
    # the lean leg), so the lean leg proves `pip install visio-schema` stays green.
    name: python + c++ suites ${{ matrix.extra || '(base)' }}
    runs-on: ubuntu-latest
    # A hang here used to cost GitHub's 360-minute default, and a wedged job
    # is indistinguishable from a slow one the whole time. These finish in
    # about three minutes; ten is generous and can only fire on a hang.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # "" proves the wire contract installs and passes with no extras at
        # all; the full leg covers every optional surface. [dev] carries
        # import-linter for the layering contract.
        extra: ["", "[dev,display,reader,dataset]"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: bufbuild/buf-setup-action@v1

      # protoc comes from the grpcio-tools WHEEL, not apt's protobuf-compiler.
      # That is nanopb's own resolution order, not a workaround --
      # third_party/nanopb/generator/proto/_utils.py: invoke_protoc "will use
      # grpcio-provided protoc if it exists, using system-installed protoc as a
      # fallback" — and `make gen` is the only thing here that ever wanted
      # protoc. Verified by regenerating on a box with no protoc on PATH at
      # all: 68 nanopb headers and the 76-descriptor blob, then pytest, cpp and
      # breaking all green.
      #
      # The point is which network it depends on. On 2026-08-19 the Ubuntu
      # archive went dark for some runner VMs — azure.archive.ubuntu.com
      # refusing, archive.ubuntu.com answering a cached InRelease then stalling
      # on every body — and `apt-get update` has no effective timeout, so this
      # step sat for 1h40m reporting itself as in progress. PyPI, GitHub and
      # packages.microsoft.com served the same VMs normally throughout. With
      # protoc off apt, this job touches the Ubuntu archive nowhere.
      #
      # python3, not python: the Makefile resolves `command -v python3` and
      # that agreement is load-bearing now that the wheel carries protoc --
      # installed into a different interpreter, nanopb_generator would not
      # find it and would fall back to the system protoc this no longer has.
      - name: Install toolchain + generate bindings
        run: |
          # This list is a hand-maintained shadow of python/pyproject.toml's
          # `dependencies`, needed BEFORE the editable install below because
          # `make gen` imports the generated bindings to prove the runtime can
          # load them. It drifts: `cryptography` became a core dependency with
          # VREC/sealed-QR support and was not added here, so gen's import check
          # failed on a package the wheel legitimately requires.
          python3 -m pip install -U pip grpcio-tools protobuf cobs mcap \
            pyserial pytest cryptography
          make gen

      # Editable install builds the native _creader. Without it HAVE_NATIVE is
      # False and the "native" and "fallback" runs below are the same code path —
      # the shipped reader would get zero CI while looking covered. A broken/missing
      # `[display]` extra fails loud here at pip install, not silently at collection.
      - name: Install package (builds native _creader)
        run: |
          pip install -e "python${{ matrix.extra }}"
          python -c "from visio_schema.transport import HAVE_NATIVE; assert HAVE_NATIVE, 'native _creader not built'"

      - run: make pytest

      - name: pytest (pure-python fallback)
        run: cd python && VISIO_NO_NATIVE=1 python -m pytest tests -q

      # The tools/ scripts are stdlib-only and import nothing from the package,
      # so this runs on the bare checkout and is not covered by `make pytest`.
      - run: make tools-test

      - run: make cpp
