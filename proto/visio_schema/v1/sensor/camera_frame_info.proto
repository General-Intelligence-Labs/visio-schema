// visio_schema/v1/sensor/camera_frame_info.proto
//
// Per-frame exposure timing for a camera stream, on
// /<device>/camera/<idx>/frame_info — a sibling of the CompressedVideo
// topic, one message per video frame.
//
// Deliberately NOT a field on foxglove.CompressedVideo: that schema is
// adopted as-is from the pinned foxglove-sdk submodule (see
// docs/protocol/foxglove_compat.md), and a same-name superset would
// collide in any consumer's descriptor pool that also loads the
// official definition. A sibling topic is also independently
// filterable via SetStreamPolicy.
//
// Join rule: `timestamp` is byte-identical to the timestamp of the video
// frame this entry describes — a plain equality join, and the only join
// key. It is unique per stream. An entry can be missing for a frame (the
// producer drops what it cannot attribute to a frame rather than guess);
// consumers should treat that as a gap and interpolate across it.
//
// Every value here is computed by the producer, which alone knows the
// sensor's exposure placement, readout geometry and capture-stamp latency.
// Consumers need no further sensor knowledge:
//
//   exposure midpoint of delivered image row r (0 = top), for an image
//   H rows tall:
//     t_mid(r) = timestamp + exposure_mid_offset_us * 1000 ns
//                + sign * (r - (H - 1) / 2) * line_delay_ns
//   where sign = +1 for READOUT_DIRECTION_TOP_TO_BOTTOM and -1 for
//   READOUT_DIRECTION_BOTTOM_TO_TOP. A global-shutter stream has
//   line_delay_ns == 0, so every row shares t_mid.
//
// A time offset previously estimated against the frame `timestamp` (for
// example a camera-to-IMU offset from calibration) is relative to that
// stamp; re-estimate it before switching a consumer to t_mid.

syntax = "proto3";

package visio_schema.v1.sensor;

import "google/protobuf/timestamp.proto";

message CameraFrameInfo {
  // Order in which the rows of the DELIVERED image (after any on-device
  // rotation) were read out.
  enum ReadoutDirection {
    READOUT_DIRECTION_UNSPECIFIED = 0;    // global shutter: line_delay_ns == 0
    READOUT_DIRECTION_TOP_TO_BOTTOM = 1;  // row 0 read first
    READOUT_DIRECTION_BOTTOM_TO_TOP = 2;  // row 0 read last
  }

  // Fields 2-13 carried earlier, raw representations of the same data.
  reserved 2 to 13;
  reserved "frame_id", "vi_time_ref", "isp_frame_id", "exposure_time_s",
           "analog_gain", "digital_gain", "isp_digital_gain", "iso",
           "coarse_integration_time_lines", "line_length_pixels",
           "frame_length_lines", "pixel_clock_mhz";

  // Capture timestamp of the video frame this entry describes — the join
  // key (see the join rule above).
  google.protobuf.Timestamp timestamp = 1;

  // Exposure (integration) duration of each row. Never 0.
  uint32 exposure_us = 14;

  // Exposure midpoint of the image's centre row, minus `timestamp`.
  // Usually negative. Includes every producer-side delay between exposure
  // and the capture stamp.
  sint32 exposure_mid_offset_us = 15;

  // Total linear gain applied to this frame: sensor analog gain x sensor
  // digital gain x ISP digital gain. 1.0 = unity.
  float gain = 16;

  // Time between the exposures of successive rows of the delivered image.
  // 0 for a global-shutter sensor.
  uint32 line_delay_ns = 17;

  ReadoutDirection readout_direction = 18;
}
