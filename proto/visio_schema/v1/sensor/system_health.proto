// visio/sensor/v1/system_health.proto
//
// Periodic system telemetry on STREAM_SYSTEM_HEALTH. Cadence ~0.2 Hz
// (one update every 5 s) is typical.
//
// All fields optional — devices emit only what they can measure.
// Parity note: replaces UMI v3's T_SYSTEM. Field semantics match the
// F_CPU_TEMP / F_CPU_USAGE / F_MEM_FREE / F_BATTERY_LEVEL /
// F_DISK_FREE_MB / F_RECORDING / F_STREAM_CLIENTS family. UMI's
// F_GRIPPERS_CONNECTED + F_CAMERAS_STARTED bitmasks become per-device
// concerns reported in DeviceInfo.streams instead.

syntax = "proto3";

package visio_schema.v1.sensor;

import "google/protobuf/timestamp.proto";

message SystemHealth {
  google.protobuf.Timestamp timestamp = 1;

  // CPU die / package temperature in degrees Celsius.
  optional float cpu_temp_c = 2;

  // CPU utilization, percent in [0.0, 100.0]. Across all cores.
  optional float cpu_usage_pct = 3;

  // Free RAM in bytes (NOT kilobytes; v3 used KB).
  optional uint64 mem_free_bytes = 4;

  // Battery state of charge, percent in [0.0, 100.0]. Unset if AC-powered
  // or no battery present.
  optional float battery_pct = 5;

  // Free disk space on the recording volume, in bytes.
  optional uint64 disk_free_bytes = 6;

  // Total size of the recording volume, in bytes. Pairs with
  // disk_free_bytes so a consumer can show "N of M free" rather than a bare
  // remainder. Both are absent when there is no recording medium to measure,
  // so the device's own rootfs never masquerades as the card.
  optional uint64 disk_total_bytes = 10;

  // True if the device is currently writing to local recording storage.
  optional bool recording = 7;

  // Count of remote subscribers currently connected to this device's
  // streams.
  optional uint32 stream_clients = 8;

  // Device wall clock (CLOCK_REALTIME) at the moment this health frame was
  // produced. Distinct from `timestamp` above, which is the device's monotonic
  // acquisition clock — this is the true calendar time, meaningful only after a
  // host has pushed it (SetTime) and/or the RTC seeded it at boot. A Timestamp
  // (not a raw int64) so Foxglove and other tools render it as a readable date.
  google.protobuf.Timestamp realtime = 9;

  // Per-camera image-sensor die temperature. One entry per camera that can
  // measure it; a sensor with no temperature register, or one that has not
  // answered yet, is absent rather than zero. Consumers must therefore key on
  // `index`, not on position in the list.
  message CameraTemp {
    // Camera index, matching this device's camera/<index> topics.
    uint32 index = 1;

    // Image-sensor die temperature in degrees Celsius. Sensor-reported
    // telemetry: the trend is dependable, the absolute offset is only as
    // good as the part's own factory calibration.
    float sensor_temp_c = 2;
  }
  repeated CameraTemp camera_temps = 11;

  // How far the device has gone to keep itself inside its thermal limits.
  //
  // A device that runs hot gives up optional work before it loses the work
  // that matters, and a consumer cannot tell that apart from a fault unless
  // the device says so: an absent live preview is otherwise indistinguishable
  // from a subscription worth re-establishing. The values are ordered — a
  // higher one means everything the lower ones gave up, and its own on top.
  //
  // Absent means this device does not report thermal mitigation at all (it may
  // still have limits it enforces); NONE means it does report, and currently
  // has nothing to report. A recording is never what gets given up.
  enum ThermalMitigation {
    THERMAL_MITIGATION_UNSPECIFIED = 0;

    // Nothing given up.
    THERMAL_MITIGATION_NONE = 1;

    // Clock headroom, and work only the device can see: it has slowed itself
    // down and stopped its own background traffic — periodic off-device
    // reports, deferred transfers. No stream a subscriber asked for is
    // affected, so there is nothing for a consumer to explain.
    THERMAL_MITIGATION_CLOCK = 2;

    // Live video is withheld from every subscriber. A recording in progress
    // is unaffected and keeps every frame; only the live copy is gone.
    THERMAL_MITIGATION_VIDEO_WITHHELD = 3;

    // Live video withheld, and what remains of the live streams thinned: the
    // per-sample streams (pose and the like) arrive at a lower rate than the
    // device can otherwise produce. A recording in progress is still intact.
    THERMAL_MITIGATION_LIVE_REDUCED = 4;
  }
  optional ThermalMitigation thermal_mitigation = 12;
}
