// visio_schema/v1/control/command_result.proto
//
// Acknowledgement for a Command (command.proto). A target replies with exactly
// one CommandResult on its own /<device>/command_result channel, correlated to
// the request by command_id. This is the ACK-ONLY status model: there is no
// periodic operational-state stream — a host pulls DeviceState on demand via the
// GetState command (or reads it back from any setter's ack). SystemHealth keeps
// carrying live health (cpu/mem/disk/recording) on its own cadence.
//
// Parity note: folds the old HTTP setup API's responses. GET /info -> DeviceState;
// GET /wifi/scan -> WifiScanResults; GET /recordings -> RecordingsList; the
// POST setters -> ok/error (+ a fresh DeviceState).

syntax = "proto3";

package visio_schema.v1.control;

// One Wi-Fi access point seen in a scan.
message WifiScanResult {
  string ssid     = 1;
  sint32 rssi     = 2;  // dBm
  string security = 3;  // e.g. "WPA2", "OPEN"
}

message WifiScanResults {
  repeated WifiScanResult results = 1;
}

// One remembered Wi-Fi network — an entry in the ordered list the device tries
// while it is offline. See DeviceState.wifi_networks.
//
// A message rather than a bare `repeated string` so a later per-entry attribute
// is an additive field instead of a second parallel array, the same reason
// WifiScanResult is a message.
//
// There is deliberately NO passphrase field, and there never will be.
// Credentials travel device-INBOUND only (ConnectWifi); nothing outbound
// carries one — the rule storage_access_key_id already follows for the S3
// secret.
message WifiNetwork {
  string ssid = 1;
}

// One recorded session on local storage, with its upload state.
message RecordingEntry {
  string name            = 1;
  uint64 size_bytes      = 2;
  uint64 started_at_us   = 3;
  double duration_s      = 4;

  enum UploadState {
    UPLOAD_STATE_NONE      = 0;
    UPLOAD_STATE_PENDING   = 1;
    UPLOAD_STATE_IN_FLIGHT = 2;
    UPLOAD_STATE_COMPLETED = 3;
    UPLOAD_STATE_FAILED    = 4;
  }
  UploadState upload_state   = 5;
  uint32      attempts       = 6;
  uint64      bytes_uploaded = 7;
  uint64      bytes_total    = 8;
  string      last_error     = 9;

  // Per-session capture metadata, read from the session's session.json (the
  // task/location/message the operator set on the device-detail "Set" panel,
  // plus the GPS fix captured at recording start). Empty/zero when none was set.
  // Lets the app show a recording's labels + location without parsing the MCAP.
  string task      = 10;
  string location  = 11;
  string message   = 12;
  double latitude  = 13;  // 0 when unknown
  double longitude = 14;  // 0 when unknown
  string capturer  = 15;  // who operated the capture (user-entered)

  // True when the session's recording data is truncated: a .mcap part that is
  // not the active recording lacks the MCAP end magic (power was cut / the
  // card was pulled mid-recording, so Stop never wrote the footer). Damaged
  // parts are never auto-uploaded (delete-after-upload would destroy the only
  // recoverable copy); recover them off-device with MCAP recovery tooling.
  bool damaged = 16;
}

message RecordingsList {
  repeated RecordingEntry recordings = 1;
}

// The device's operational-state snapshot — the GET /info payload. Fields that
// DeviceInfo (device_name/serial/firmware + channels) and SystemHealth
// (recording, disk_free_bytes, disk_total_bytes) already report are
// intentionally NOT duplicated
// here. Carried only inside CommandResult; it has no own stream.
message DeviceState {
  // ── recording ──
  bool   recording_auto_start    = 1;
  string recording_session_name  = 2;  // empty when not recording
  uint64 recording_started_at_us = 3;  // 0 when not recording
  string recording_task          = 19; // active capture task; empty otherwise

  // Persisted recording-metadata defaults (SetRecordingMeta sidecar), echoed so
  // the app can confirm what's stored — independent of whether a recording is
  // active (unlike recording_task). Empty if unset.
  string recording_meta_task     = 20;
  string recording_meta_location = 21;
  string recording_meta_message  = 22;
  string recording_meta_capturer = 24;

  // ── disk ──
  sint32 disk_free_pct = 4;   // 0..100, or -1 = unknown
  bool   disk_no_sdcard = 5;

  // ── wifi ──
  enum WifiState {
    WIFI_STATE_DISABLED    = 0;
    WIFI_STATE_STA         = 1;
    WIFI_STATE_AP_FALLBACK = 2;
  }
  WifiState wifi_state      = 6;
  string    wifi_ssid       = 7;
  string    wifi_ip         = 8;
  string    wifi_last_error = 9;

  // Remembered STA networks, NEWEST FIRST — the order the device tries them in
  // while it is offline. Index 0 is the most recently joined.
  //
  // The device owns the ordering, not the host: a successful ConnectWifi puts
  // its SSID at index 0 (moving it if already present, and replacing the stored
  // passphrase), ForgetWifi removes one entry, ResetToAp clears all of them.
  // There is no reorder command. While the device IS associated it does not
  // switch away on its own — the order governs what it reaches for when it has
  // no link, not a preference it re-evaluates.
  //
  // "Which one am I on?" is deliberately NOT a field here: compare an entry's
  // ssid against wifi_ssid above (meaningful only while wifi_state ==
  // WIFI_STATE_STA). One source of truth, so a stale per-entry flag can never
  // contradict the actual connection.
  //
  // ABSENT on firmware predating this field — which proto3 makes
  // indistinguishable from "nothing is remembered" (repeated has no presence).
  // A device can also be joined to a network it cannot list, if its stored
  // config holds a block the device does not manage (WPA-Enterprise, a hidden
  // network). BOTH cases look the same on the wire and mean the same thing to a
  // client: an EMPTY list next to a non-empty wifi_ssid is "this network exists
  // but I cannot manage it", never "nothing is saved". Render the one network
  // you do know about and hide the per-entry forget; do not probe with
  // ForgetWifi, whose `unsupported` is a permanent refusal.
  repeated WifiNetwork wifi_networks = 30;

  // ── storage (config only; never the secret key) ──
  bool   storage_configured = 10;
  string storage_endpoint   = 11;
  string storage_bucket     = 12;
  string storage_prefix     = 13;
  // Access key ID is an identifier (not a secret), echoed back so the app can
  // show which credential is configured. The secret access key is NEVER echoed.
  string storage_access_key_id = 26;
  // The status-report key prefix (see SetStorage.status_prefix). Echoed so the
  // app can show where health reports land; empty means the device default.
  string storage_status_prefix = 32;

  // ── upload queue ──
  uint32 upload_pending             = 14;
  uint32 upload_in_flight           = 15;
  uint32 upload_failed              = 16;
  string upload_last_error          = 17;
  uint64 upload_last_completed_at_us = 18;
  // Whether auto-upload is enabled (SetAutoUpload). Default true; when false the
  // uploader is idle but keeps its creds + queue.
  bool   auto_upload_enabled        = 25;

  // ── video ──
  // Persisted camera H.265 target bitrate (kbit/s), shared by all cameras (the
  // SetBitrate sidecar, falling back to the per-camera config default). Echoed
  // so the app can show which preset is active. Takes effect on the next boot.
  uint32 video_bitrate_kbps = 23;

  // Persisted camera capture resolution, shared by all cameras (the
  // SetResolution sidecar, falling back to the per-camera config default).
  // Echoed like video_bitrate_kbps; a pending change applies on next boot.
  uint32 video_width  = 27;
  uint32 video_height = 28;

  // ── audio ──
  // Whether mic capture reaches recordings (SetAudioRecording).
  //
  // Deliberately tri-state rather than a bool: UNSUPPORTED covers both "this
  // board has no mic" and "this firmware predates the toggle", and lets the app
  // hide the control instead of guessing. A bool would default to false on old
  // firmware, so the app would show the switch OFF while the device was in fact
  // recording audio — worse than showing nothing. Same reason video_width == 0
  // hides the resolution control.
  enum AudioRecording {
    AUDIO_RECORDING_UNSUPPORTED = 0;
    AUDIO_RECORDING_ENABLED     = 1;
    AUDIO_RECORDING_DISABLED    = 2;
  }
  AudioRecording audio_recording = 29;

  // ── status reports ──
  // Whether the device periodically PUTs health + a camera JPEG to the status
  // prefix (SetStatusReport).
  //
  // Tri-state for the same reason as AudioRecording above: UNSUPPORTED covers
  // both "this firmware predates status reports" and "status reporting is
  // disabled in the board config", and lets the app HIDE the control rather
  // than render a switch it cannot actually move. A bool would read false on
  // old firmware, which is indistinguishable from "supported but off".
  enum StatusReport {
    STATUS_REPORT_UNSUPPORTED = 0;
    STATUS_REPORT_ENABLED     = 1;
    STATUS_REPORT_DISABLED    = 2;
  }
  StatusReport status_report = 31;

  // ── recording heartbeat ──
  // Whether the recording tick-tock voice heartbeat plays
  // (SetRecordingHeartbeat).
  //
  // Tri-state for the same reason as AudioRecording above: UNSUPPORTED covers
  // both "this board has no speaker / voice notices" and "this firmware
  // predates the toggle", and lets the app HIDE the control rather than render
  // a switch it cannot actually move.
  enum RecordingHeartbeat {
    RECORDING_HEARTBEAT_UNSUPPORTED = 0;
    RECORDING_HEARTBEAT_ENABLED     = 1;
    RECORDING_HEARTBEAT_DISABLED    = 2;
  }
  RecordingHeartbeat recording_heartbeat = 33;
}

// The single ack a device emits per Command on /<device>/command_result.
//
// A receiver MUST answer a Command that names it in `target_device`, even one it
// does not understand: reply `ok=false, error_code="unsupported"`. Silence is not
// a valid answer — a caller cannot distinguish it from a slow link, so it spends
// its whole command timeout and every retry on something that can never succeed,
// and a newer host talking to older firmware degrades on a stopwatch instead of
// immediately. `"unsupported"` is a PERMANENT refusal: callers must not retry it.
//
// A BROADCAST (empty `target_device`) is exempt, and must stay silent when
// unsupported — it reaches every leaf behind a hub, so answering would put N
// contradictory replies on the wire against one command_id.
message CommandResult {
  uint64 command_id    = 1;  // echoes Command.command_id
  bool   ok            = 2;
  // Machine-readable; empty when ok. Well-known: "unsupported" (this receiver
  // does not implement the command — permanent, do not retry).
  string error_code    = 3;
  string error_message = 4;  // human-readable; empty when ok

  // Command-specific return data. Setters + GetState return `state`; ScanWifi
  // returns `scan`; ListRecordings returns `recordings`; start/stop/identify
  // leave payload unset.
  oneof payload {
    DeviceState     state      = 10;
    WifiScanResults scan       = 11;
    RecordingsList  recordings = 12;
  }
}
