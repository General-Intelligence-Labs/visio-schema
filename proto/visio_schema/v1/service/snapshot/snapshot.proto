syntax = "proto3";

package visio_schema.v1.service.snapshot;

// A finite response to one CaptureSnapshot or GetRecordingPreview command, on
// /<device>/snapshot. Only its requesting connection receives these messages.
// The ordered chunks (a JPEG, or a recording preview's H.265 video) start at
// offset zero; complete when offset+size equals the metadata's
// total_bytes. There are no per-chunk requests or acknowledgments. A missing
// chunk, disconnect or deadline fails the capture; request a new image.
message SnapshotChunk {
  // The nonzero command_id of the CaptureSnapshot or GetRecordingPreview on
  // this connection.
  uint64 snapshot_id = 1;
  uint32 offset = 2;
  // 1..1024 bytes of the image or video (the field is named for the JPEG it
  // first carried). This wire bound permits control messages to interleave
  // at complete frame boundaries; ATT fragmentation remains a transport concern.
  bytes jpeg = 3;
}
