// visio_schema/v1/service/ota/ota.proto
//
// Firmware-update service. Host→device control + bulk data on the
// CONTROL_STREAM_OTA control stream; OtaMessage carries target_device, exactly
// like Command, because a reserved control id is never remapped and so cannot
// itself say which device a frame is for. Device→host progress is published on
// the per-device named channel "/<device>/ota_status" (a dynamic data channel
// advertised via DeviceInfo — NOT a reserved control id), mirroring the Command
// (control id) / CommandResult (named channel) split.
//
// THE NORMATIVE SPEC IS docs/protocol/ota.md. It states the session, what
// bytes_received means, the chunk-size negotiation and its bounds, the board
// mark, and the multi-board package. This file is the message shapes.
//
// ONE PACKAGE, ONE DEVICE. A sender pushes one file to one device and is
// agnostic to what is behind it. A device with limbs attached receives the same
// single file a single-board device does, containing every board's image, and
// updates its own limbs from it — see wire/package.py for that container. So
// nothing here describes a per-board delivery: there is no longer such a thing.
//
// Why its own control stream rather than a Command body: a full image is
// 30–60 MB = tens of thousands of chunks. That is too big for the single-ack
// CommandResult model and too heavy for the small-message COMMAND stream, so
// OTA gets a dedicated stream that carries both control and data frames.
//
// TWO WAYS TO STAGE, chosen by the device's own config, and the wire does not
// change between them. `file` is the shipped ego path, described below.
// `slot` streams each partition straight into the inactive A/B slot as it
// arrives and skips the recovery detour entirely; a sender cannot tell, and
// must not try.
//
// STAGE-THEN-FLASH (`file`). The whole image crosses this stream ONCE, into
// normal mode:
//   * Normal mode receives every OtaChunk and streams it to a staging file on a
//     partition the update never writes (userdata), decrypting and hashing as it
//     goes — so the image is never held whole in RAM, but it IS held whole on
//     disk across the reboot. On OtaCommit it verifies the decrypted image, arms
//     recovery, and reboots.
//   * Recovery reads that staged file and flashes the inactive A/B slot. It
//     speaks NO protocol and touches no network: the receiving half of an
//     earlier design, in which recovery re-received the stream itself, was
//     dropped precisely because a Wi-Fi OTA would then need a network stack (and
//     the decryption key) inside a tiny recovery ramdisk.
//
// A power loss at any point leaves the staged image intact and recovery still
// armed, so the flash simply re-runs; the active slot is never written.
//
// Payload opacity: the bytes are one opaque encrypted image. The host is a BLIND
// RELAY — it pulls the file from the cloud and pushes it unchanged, and only the
// device holds the key. Authenticity rests on that shared key (only a key holder
// can produce a ciphertext that decrypts to a valid image with the declared
// digest), which is why no field here carries a signature.

syntax = "proto3";

package visio_schema.v1.service.ota;

// Host→device, on CONTROL_STREAM_OTA. One message type carries the whole
// session (manifest, data, lifecycle), like Command's oneof body.
message OtaMessage {
  // Intended recipient, by device name (DeviceInfo.device_name). A receiving
  // peer MUST ignore OtaMessages whose target_device is neither empty
  // (broadcast — discouraged for OTA) nor its own name. Mirrors
  // Command.target_device; required because a control id is never remapped and
  // so cannot itself disambiguate devices across a hub.
  string target_device = 1;

  // Correlates every frame of one transfer; echoed in OtaStatus.session_id.
  // The host picks it (monotonic per host is sufficient).
  uint64 session_id = 2;

  oneof body {
    OtaBegin  begin  = 10;  // manifest, once, opens the session
    OtaChunk  chunk  = 11;  // package bytes at an absolute offset
    OtaCommit commit = 12;  // all bytes sent → verify + apply
    OtaAbort  abort  = 13;  // cancel; device discards staging
    OtaQuery  query  = 14;  // poll: emit current OtaStatus (for resume)
    // DEPRECATED, with OtaBegin.hold_apply: a sender no longer defers a
    // device's apply, so nothing puts this on the wire. Kept (never removed,
    // never reused) so the field number cannot come back meaning something
    // else. A device that DOES defer its own apply -- a head that flashes
    // itself last -- decides that internally, from the package it received.
    OtaApply  apply  = 15 [deprecated = true];
  }
}

// Sent once to open a session, naming what is about to arrive. Fields 1-4 are
// the whole live contract: the device decides from fw_version whether it even
// needs the transfer (already running it → SUCCESS; it is what the other A/B
// slot holds → instant revert, no bytes), rejects an image marked for another
// board, and sizes its staging free-space check from total_bytes.
//
// Fields 5-8 are RESERVED BUT UNUSED by the shipped protocol, and neither end
// reads or writes them. They describe the earlier design in which the host sent
// a signed manifest plus a partition map and recovery received the stream
// itself. Integrity and authenticity now live INSIDE the opaque payload — its
// envelope carries the plaintext length and digest, and possession of the shared
// key is the forgery gate — so nothing here needs to be signed. Kept rather than
// removed because dropping a field number is a wire break for no gain; do not
// start populating them without a design that says what verifies what.
message OtaBegin {
  string fw_version  = 1;  // version being delivered (free-form semver)
  string board       = 2;  // MUST equal the device's own board identifier
  uint64 total_bytes = 3;  // size of the opaque payload, in bytes
  // The size the sender will actually use. NOT merely a hint: the device paces
  // its RECEIVING acks off this, and those acks are the sender's window credit,
  // so declaring one size and sending another either starves the window or
  // overruns it. Bounded by OtaChunk.data's ceiling below.
  uint32 chunk_bytes = 4;
  bytes  sha256      = 5;  // UNUSED — the payload envelope carries the digest
  bytes  signature   = 6;  // UNUSED — see above; the shared key is the gate
  uint32 min_version = 7;  // UNUSED — no anti-rollback floor is enforced here
  repeated OtaPartition partitions = 8;  // UNUSED — the payload names its own

// DEPRECATED, and no sender sets it. Two-phase staging: the device verified
  // and staged at Commit but moved no slot, holding until an OtaApply named
  // this version.
  //
  // It existed to shrink the mixed-version window when the APP pushed to each
  // board of a rig over a phone link — minutes per limb. A hub now receives ONE
  // package, holds every image locally, and pushes over a fast local leg, so
  // that window is seconds. And the revert path has to be bulletproof whatever
  // happens, so a mechanism whose only job is to keep the common failures away
  // from it leaves the most safety-critical path exercised only in the rarest
  // cases. A commit applies, on a limb exactly as on a single board.
  //
  // A hub still defers its OWN apply — head-last is structural — but that is
  // internal and derived from the package it received, not something the wire
  // can ask for. Kept (never removed, never reused) so a field number cannot
  // come back meaning something else; proto3 omits it when false, so every
  // begin on the wire is byte-identical to one sent before it existed.
  bool hold_apply = 9 [deprecated = true];
}

// UNUSED — see OtaBegin.partitions. The flash layout is read out of the image
// itself on the device, not declared on the wire.
message OtaPartition {
  string name   = 1;  // MTD partition name, e.g. "boot", "rootfs"
  uint64 size   = 2;  // bytes of this partition's image in the stream
  bytes  sha256 = 3;  // per-partition digest (early corruption detection)
}

// One slice of the opaque payload, at its ABSOLUTE byte offset (not a running
// counter) so retransmits are idempotent and a resume needs no per-chunk
// bookkeeping. Chunks are fed strictly IN ORDER: the device decrypts as a
// stream, so a chunk beyond its high-water mark is a gap, answered with
// NEEDS_RESUME carrying the offset to rewind to, and one before it is a
// harmless duplicate. There is no per-chunk digest — a corrupted frame fails the
// wire CRC and simply becomes a gap.
message OtaChunk {
  uint64 offset = 1;  // absolute offset into the opaque payload
  // chunk_bytes payload (last chunk may be short).
  //
  // HARD CEILING 65535. nanopb is built here without PB_FIELD_32BIT, so
  // pb_size_t is uint_least16_t and PB_SIZE_MAX is 65535 — a larger chunk
  // cannot be pb_decode'd at all. The device answers every such frame with
  // "OtaMessage decode failed" and the transfer never advances, which reads
  // like a dead link rather than a size problem. Confirmed on hardware: a
  // large image pushed at 256 KiB chunks moves nothing at all.
  bytes  data   = 2;
}

// All bytes delivered. The device finishes decrypting, checks the payload
// against the length and digest its envelope declares, publishes the staged
// image for recovery, then arms recovery and reboots. Carries no fields — the
// session is identified by OtaMessage.session_id.
message OtaCommit {}

// Cancel the in-flight session; device deletes the staging file and returns to
// IDLE.
message OtaAbort {
  string reason = 1;  // human-readable, for logs/telemetry
}

// Ask the device to emit a fresh OtaStatus for OtaMessage.session_id without
// sending data — used after a reconnect to read the resume cursor
// (bytes_received) or learn the staging file vanished (NEEDS_RESUME).
message OtaQuery {}

// DEPRECATED. Flash a stage that OtaCommit verified but held: arm recovery and
// reboot NOW.
//
// It was the second half of a rig's two-phase update, when a SENDER staged
// every board and then applied them. A sender no longer does either: it pushes
// one package to one device, and that device decides its own apply order from
// what the package contains. So nothing puts this on the wire.
//
// The message shape survives as the head's own loopback self-apply — it holds
// its apply because head-last is structural, and this is how it fires it — and
// so that the field number can never come back meaning something else. Do not
// send one; a device is free to stop answering them.
//
// fw_version must equal the held stage's version: an apply that races a newer
// stage must not flash whichever happened to land. Addressed like every
// OtaMessage (target_device); a device holding no such stage answers FAILED
// rather than guessing.
message OtaApply {
  string fw_version = 1;
}

// Device→host, published on "/<device>/ota_status". Serves three jobs at once:
// progress UI, flow-control ACK (the app paces sends against bytes_received),
// and the resume cursor. Emitted periodically during RECEIVING and on every
// state transition.
message OtaStatus {
  string device     = 1;  // source device name (informational; topic is scoped)
  uint64 session_id = 2;  // echoes OtaMessage.session_id; 0 when IDLE/no session

  enum State {
    IDLE       = 0;  // no session
    RECEIVING  = 1;  // accepting chunks
    VERIFYING  = 2;  // checking the payload against its envelope on OtaCommit
    STAGED     = 3;  // verified, about to reboot into recovery
    APPLYING   = 4;  // recovery is flashing (reported on next normal boot)
    SUCCESS    = 5;  // new firmware booted and checked in
    FAILED     = 6;  // see error_code/error_message
    NEEDS_RESUME = 7;  // a gap (or a short image at commit): rewind to
                       // bytes_received and resend from there
  }
  State state = 3;

  uint64 bytes_received = 4;  // contiguous bytes staged = progress + resume cursor + ACK
  uint32 progress_pct   = 5;  // 0..100, convenience for UIs

  // Machine- then human-readable failure detail (empty unless FAILED), matching
  // CommandResult's error_code/error_message convention. Codes e.g.
  // "verify_failed", "decrypt_failed", "stage_write_failed", "no_space",
  // "wrong_board", "no_session", "revert_failed".
  string error_code    = 6;
  string error_message = 7;

  // ── A/B slot state (set on every status the device emits) ─────────────────
  // The booted slot ("a"/"b") and the OTHER slot's recorded firmware version
  // (empty when unknown/never flashed). When `revert_available`, pushing an
  // OtaBegin whose fw_version equals `other_slot_version` performs an instant
  // slot flip (no image transfer): the device re-arms the old slot and reboots
  // — the user-triggered revert. `last_ota_reverted` reports that the previous
  // update never boot-confirmed and U-Boot auto-rolled back to this slot.
  string active_slot        = 8;
  string other_slot_version = 9;
  bool   revert_available   = 10;
  bool   last_ota_reverted  = 11;

  // ── Receive capability ────────────────────────────────────────────────────
  // The largest OtaChunk.data this device wants, in bytes. A sender uses
  // min(its own protocol CEILING, this) — not its own default, which would make
  // this field a no-op — and puts the same number in OtaBegin.chunk_bytes,
  // which is also what paces the device's RECEIVING acks — chunk size and ack
  // cadence are one mechanism, since the acks are the sender's window credit.
  //
  // It is a property of the BOARD, not of the link: an RV1106 on SPI NAND wants
  // small chunks because its rx path is sized for the CDC-ACM gadget's tiny RX
  // FIFO, while an RV1126B on eMMC behind a 5 Gbps gadget has no such limit and
  // paying that cadence costs it tens of thousands of status publishes per
  // image. Senders learn it from the OtaStatus answering an OtaQuery, before
  // OtaBegin.
  //
  // 0 = not reported: firmware predating this field. Senders MUST then fall
  // back to their own default (32 KiB), which is what every device accepted
  // before this existed — so a mixed fleet needs no coordination.
  //
  // A sender MUST clamp this to OtaChunk.data's 65535 ceiling rather than trust
  // it: a device that advertises more is wrong, and believing it breaks the push.
  uint32 max_chunk_bytes = 12;
}
