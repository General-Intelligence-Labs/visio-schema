// Hop-local liveness, four-timestamp clock observations, and immutable capture
// mappings. The receiving reference estimates a producer's clock; that producer
// installs the same mapping used to translate its incoming data on the receiver.
// See docs/protocol/timesync.md for timestamp placement and revision ownership.
// T1 = echo_tx, T2 = echo_rx, T3 = tx, T4 = local read;
// network RTT = (T4-T1)-(T3-T2). Kernel queues/path asymmetry remain unobserved.

syntax = "proto3";

package visio_schema.v1.service.heartbeat;

// Immutable producer-clock -> receiving-reference-clock transform. The receiver
// (the head for a wrist link) owns the estimate. Activation/expiry are capture
// times on the producer clock, not arrival times. Both ends apply this exact
// revision: reference = reference_epoch_ns + (peer-peer_epoch_ns)*(1+rate_ppb/1e9).
message ClockMapping {
  fixed64 authority_epoch = 1;
  uint32 revision = 2;
  int64 peer_epoch_ns = 3;
  int64 reference_epoch_ns = 4;
  sint64 rate_ppb = 5;
  int64 valid_until_peer_ns = 6;
  uint64 phase_sigma_ns = 7;
  uint64 rate_sigma_ppb = 8;
  uint64 grid_phase_ns = 9;
  uint64 grid_period_ns = 10;
  uint64 grid_generation = 11;
  // Stable reference-camera frame number associated with grid_phase_ns.
  uint64 grid_frame_index = 12;
  uint32 idr_period_frames = 13;
}

message CameraSyncState {
  uint32 camera_index = 1;
  uint64 capture_generation = 2;
  uint64 encoder_generation = 3;
  bool phase_locked = 4;
  uint64 last_idr_frame = 5;
}

message Heartbeat {
  // Sender's local monotonic clock (ns) at send, stamped at the moment of
  // the first successful write, after the userspace send queue. Always set.
  uint64 tx_mono_ns = 1;

  // On a response beacon: the `tx_mono_ns` this sender is echoing back to
  // the peer that originated it (the peer's clock). 0 on an initiating
  // beacon — its presence is what marks a beacon as a response.
  uint64 echo_tx_mono_ns = 2;

  // On a response beacon: this sender's local monotonic clock (ns) at the
  // moment it received the beacon identified by `echo_tx_mono_ns`. 0 on an
  // initiating beacon.
  uint64 echo_rx_mono_ns = 3;

  // Optional backpressure hint: the sender's instantaneous outbound queue
  // depth, in messages. 0 means "no backpressure" / "not reported."
  uint32 queue_depth = 4;

  // Stable identity of the SENDER, not of this connection: the same string
  // across reconnects, transports and app restarts (a per-install uuid on a
  // phone). "" = not reported.
  //
  // A device that allows one client at a time cannot otherwise tell "my phone
  // is back" from "a second phone wants the board": a link dropped without a
  // FIN — Wi-Fi provisioning, reset-to-hotspot, an app restart — leaves a
  // socket the owner has already walked away from, and refusing the owner's
  // next connection locks them out of their own device. Carried on the beacon
  // because it is the one message every healthy client already sends, so
  // identity costs no extra round trip; it therefore arrives shortly AFTER
  // accept, and occupancy is resolved when it does.
  string client_id = 5;

  // Unused: camera phase is carried only in the authoritative ClockMapping.
  // No estimator or servo consumes this standalone hint.
  uint64 cam_grid_phase_ns = 6;

  // Reference snapshot for THIS connection; never fan out a wrist's transform
  // to another peer. No mapping is sent before the estimator has acquired.
  ClockMapping clock_mapping = 7;
  // The mapping actually active on the sender's capture clock.
  fixed64 applied_authority_epoch = 8;
  uint32 applied_revision = 9;
  // Changes on process restart, including a peer reboot on a reopenable leg.
  fixed64 clock_epoch = 10;
  repeated CameraSyncState camera_sync = 11;
}
